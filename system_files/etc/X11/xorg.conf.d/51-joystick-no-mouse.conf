# Compositor must not turn the built-in pad or the codec jack into a pointer
# or a keyboard. Games still read the pad through evdev/SDL.
Section "InputClass"
        Identifier "handheld pad never pointer"
        MatchProduct "AYN Odin|AYN Thor|RSInput Gamepad|gpio-keys-paddles"
        MatchDevicePath "/dev/input/event*"
        Option "Ignore" "true"
EndSection

Section "InputClass"
        Identifier "headset jack is not a keyboard"
        MatchProduct "Headset Jack"
        MatchDevicePath "/dev/input/event*"
        Option "Ignore" "true"
EndSection
