# If xserver-xorg-input-joystick ever gets installed, never drive the cursor.
Section "InputClass"
        Identifier "joystick no mouse"
        MatchIsJoystick "on"
        MatchDevicePath "/dev/input/event*"
        Driver "joystick"
        Option "StartKeysEnabled" "False"
        Option "StartMouseEnabled" "False"
EndSection
