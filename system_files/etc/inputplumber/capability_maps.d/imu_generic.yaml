# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
# Generic IMU evdev → InputPlumber gamepad accelerometer/gyro (upstream map).
version: 2
kind: CapabilityMap
name: Generic IMU
id: imu_generic

mapping:
  - name: Accelerometer
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_X
          value_type: imu_x
      - evdev:
          event_type: ABS
          event_code: ABS_Y
          value_type: imu_y
      - evdev:
          event_type: ABS
          event_code: ABS_Z
          value_type: imu_z
    target_event:
      gamepad:
        accelerometer:
          name: Accelerometer

  - name: Gyro
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_RX
          value_type: imu_x
      - evdev:
          event_type: ABS
          event_code: ABS_RY
          value_type: imu_y
      - evdev:
          event_type: ABS
          event_code: ABS_RZ
          value_type: imu_z
    target_event:
      gamepad:
        gyro:
          name: Gyro

filtered_events: []
