# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# AYN Odin 3 rsinput → deck-uhid only.
# passthrough must stay false. If the raw pad stays visible, Steam sees a
# second Xbox-style controller and the touch panel flips the glyph layout.
version: 1
kind: CompositeDevice
name: AYN Layout

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin 3

single_source: false

source_devices:
  - group: gamepad
    evdev:
      phys_path: rsinput-gamepad/input0
      handler: event*
    capability_map_id: ayn_mcu
    passthrough: false

options:
  auto_manage: true

target_devices:
  - deck-uhid
  - keyboard
