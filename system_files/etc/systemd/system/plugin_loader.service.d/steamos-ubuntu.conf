# SteamOS-Ubuntu: Decky PluginLoader env for FEX + gentle restart.
# Do not use a short RestartSec — FEX reload races nested gamescope under Plasma.
[Service]
Restart=on-failure
RestartSec=8
Environment=HOME=/home/steam
Environment=USER=steam
Environment=XDG_CONFIG_HOME=/home/steam/.config
Environment=XDG_DATA_HOME=/home/steam/.local/share
Environment=XDG_RUNTIME_DIR=/run/user/1000
