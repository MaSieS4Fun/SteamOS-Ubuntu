# Don't hold greetd behind plymouth-quit-wait (can sit on network-online).
# Seat + user-sessions are enough; NetworkManager comes up in parallel for OOBE Wi-Fi.
[Unit]
# Empty After= clears the vendor list (incl. plymouth-quit-wait), then re-add what we need.
After=
After=systemd-user-sessions.service seatd.service
Wants=seatd.service
