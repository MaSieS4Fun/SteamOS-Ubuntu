# Persist Gaming Mode session log across boots (and into /var/log dumps).
# Also keep /var/tmp/steamos-session.log as a symlink for older docs/scripts.
d /var/log 0755 root root -
f /var/log/steamos-session.log 0666 root root -
d /var/tmp 1777 root root -
L /var/tmp/steamos-session.log - - - - /var/log/steamos-session.log
