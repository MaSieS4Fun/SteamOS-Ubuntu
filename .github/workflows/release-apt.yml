name: Release apt repository

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-apt
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg gzip

      - name: Import apt signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [[ -z "${APT_GPG_PRIVATE_KEY}" ]]; then
            echo "ERROR: APT_GPG_PRIVATE_KEY secret is missing"
            echo "Add it in Settings → Secrets → Actions (armor export of packaging/apt/.gnupg)"
            exit 1
          fi
          mkdir -p packaging/apt/.gnupg
          chmod 700 packaging/apt/.gnupg
          export GNUPGHOME="${GITHUB_WORKSPACE}/packaging/apt/.gnupg"
          echo "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import
          key_id="$(gpg --list-secret-keys --with-colons | awk -F: '$1=="sec"{print $5; exit}')"
          [[ -n "${key_id}" ]] || { echo "ERROR: GPG import failed"; exit 1; }
          echo "APT_SIGN=1" >> "$GITHUB_ENV"
          echo "APT_GPG_KEY_ID=${key_id}" >> "$GITHUB_ENV"
          echo "Imported signing key ${key_id}"

      - name: Build .deb packages
        run: |
          chmod +x scripts/build-debs.sh scripts/generate-apt-repo.sh
          ./scripts/build-debs.sh

      - name: Generate apt repository
        env:
          GNUPGHOME: ${{ github.workspace }}/packaging/apt/.gnupg
          APT_SIGN: "1"
          APT_GPG_KEY_ID: ${{ env.APT_GPG_KEY_ID }}
        run: |
          ./scripts/generate-apt-repo.sh
          [[ -f output/apt-repo/InRelease ]] || { echo "ERROR: unsigned apt repo (missing InRelease)"; exit 1; }
          ls -la output/apt-repo/InRelease output/apt-repo/Release.gpg packaging/apt/steamos-ubuntu.gpg

      - name: Upload debs artifact
        uses: actions/upload-artifact@v4
        with:
          name: steamos-ubuntu-debs
          path: output/debs/*.deb

      - name: Deploy apt repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: output/apt-repo
          destination_dir: apt
          keep_files: false

      - name: Attach debs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/debs/*.deb
            packaging/apt/steamos-ubuntu.gpg
          generate_release_notes: true
