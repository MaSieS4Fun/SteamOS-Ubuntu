name: Release apt repository

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-apt
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg gzip

      - name: Import apt signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [[ -z "${APT_GPG_PRIVATE_KEY}" ]]; then
            echo "WARN: APT_GPG_PRIVATE_KEY not set — unsigned repo"
            exit 0
          fi
          mkdir -p packaging/apt/.gnupg
          chmod 700 packaging/apt/.gnupg
          export GNUPGHOME="${GITHUB_WORKSPACE}/packaging/apt/.gnupg"
          echo "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import
          echo "APT_SIGN=1" >> "$GITHUB_ENV"
          echo "APT_GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '$1==\"sec\"{print $5; exit}')" >> "$GITHUB_ENV"

      - name: Build .deb packages
        run: |
          chmod +x scripts/build-debs.sh scripts/generate-apt-repo.sh
          ./scripts/build-debs.sh

      - name: Generate apt repository
        env:
          GNUPGHOME: ${{ github.workspace }}/packaging/apt/.gnupg
        run: |
          export APT_SIGN="${APT_SIGN:-0}"
          ./scripts/generate-apt-repo.sh

      - name: Upload debs artifact
        uses: actions/upload-artifact@v4
        with:
          name: steamos-ubuntu-debs
          path: output/debs/*.deb

      - name: Deploy apt repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: output/apt-repo
          destination_dir: apt
          keep_files: false

      - name: Attach debs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/debs/*.deb
            packaging/apt/steamos-ubuntu.gpg
          generate_release_notes: true
