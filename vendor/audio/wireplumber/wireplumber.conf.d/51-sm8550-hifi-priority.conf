# Stock SM8550 ACP priorities (matches original Desktop/audio README / demo).
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        priorities = [
          "HiFi (Headphones, Speaker)"
          "HiFi (DisplayPort, Speaker)"
          "pro-audio"
        ]
      }
    }
  }
]
