# Demo video profiles: HiFi = HDMI/DP; Pro Audio = speakers + jack.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        priorities = [
          "HiFi (DisplayPort, Speaker)"
          "HiFi (Speaker, DisplayPort)"
          "HiFi (DisplayPort)"
          "pro-audio"
        ]
      }
    }
  }
]
