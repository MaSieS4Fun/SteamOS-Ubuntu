# Use case configuration for AYN SM8750
# Author: Teguh Sobirin <teguh@sobir.in>

Syntax 4

SectionUseCase."HiFi" {
	File "/AYN/Odin3/HiFi.conf"
	Comment "HiFi quality Music. (DisplayPort, Speaker)"
}

# Speaker (MultiMedia1) and minijack (MultiMedia2) stay routed for Pro Audio.
# HiFi only opens MultiMedia4. These csets must not live in the verb
# DisableSequence, or leaving HiFi would mute Pro Audio.
BootSequence [
	cset "name='RX_RX0 Digital Volume' 84"
	cset "name='RX_RX1 Digital Volume' 84"
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC2 Volume' 10"
	cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
	cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
	cset "name='HPH PCM Switch' 1"
	cset "name='RX_HPH PCM Switch' 1"
	cset "name='RX_HPH PWR Mode' LOHIFI"
	cset "name='RX_MACRO RX0 MUX' AIF1_PB"
	cset "name='RX_MACRO RX1 MUX' AIF1_PB"
	cset "name='RX INT0_1 MIX1 INP0' RX0"
	cset "name='RX INT1_1 MIX1 INP0' RX1"
	cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
	cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
	cset "name='HPHL_RDAC Switch' 1"
	cset "name='HPHR_RDAC Switch' 1"
	cset "name='HPHR_COMP Switch' 1"
	cset "name='HPHL_COMP Switch' 1"
	cset "name='HPHL Switch' 1"
	cset "name='HPHR Switch' 1"
	cset "name='CLSH Switch' 1"
	cset "name='RX HPH Mode' CLS_H_LOHIFI"
]

LibraryConfig.remap.Config {

	ctl.default.map {
		"name='HP Volume'" {
			"name='HPHL Volume'".vindex.0 0
			"name='HPHR Volume'".vindex.1 0
		}
	}
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd939x/init.conf"
