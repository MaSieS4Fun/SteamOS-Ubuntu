# Use case configuration for AYN Odin 3 (SM8750)
#
# Same menu as Odin 2:
#   Off
#   HiFi quality Music. (DisplayPort, Speaker)
#   Pro Audio
#
# HDMI is MultiMedia4 (PCM 3). Speakers stay on PCM 0 and the minijack on
# PCM 1, so this verb does not clear those mixers. JackHWMute hides the
# speaker port in this profile while the dock is connected.

SectionVerb {
	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia4' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia4' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Value {
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."DisplayPort" {
	Comment "DisplayPort playback"

	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia4' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia4' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},3"
		JackControl "DP0 Jack"
		JackHWMute "Speaker"
	}
}
