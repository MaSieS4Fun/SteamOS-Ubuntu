# Resting profile is Pro Audio (speakers + minijack).
# sm8750-audio-profile switches to HiFi while the HDMI dock is connected.
# Match the card name. Odin 2 is also alsa_card.platform-sound; a match on
# that alone applies these rules there and the HiFi entry disappears.
device.profile.priority.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-sound"
        alsa.card_name = "SM8750-AYN"
      }
    ]
    actions = {
      update-props = {
        priorities = [
          "pro-audio"
        ]
      }
    }
  }
]

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.platform-sound.pro-output-0"
        api.alsa.card.name = "SM8750-AYN"
      }
    ]
    actions = {
      update-props = {
        node.description = "Speakers"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.platform-sound.pro-output-1"
        api.alsa.card.name = "SM8750-AYN"
      }
    ]
    actions = {
      update-props = {
        node.description = "Minijack"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.platform-sound.pro-output-3"
        api.alsa.card.name = "SM8750-AYN"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
