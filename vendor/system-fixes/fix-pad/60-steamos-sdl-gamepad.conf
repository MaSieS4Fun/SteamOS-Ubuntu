# Force SDL2 gamecontroller path for AYN Odin 2 (rsinput), not mouse remapping.
# SDL_GAMECONTROLLERCONFIG is user priority and replaces SDL's built-in map.
# The file is default priority, so the built-in entry wins if this is unset.
# Xbox 360 layout: X/Y stay on b3/b2; LB/RB are crossed in rsinput (b5/b4).
SDL_GAMECONTROLLERCONFIG=0300b605202000000130000001000000,AYN Odin2 Gamepad,platform:Linux,a:b0,b:b1,x:b3,y:b2,back:b6,start:b7,guide:b8,leftshoulder:b5,rightshoulder:b4,leftstick:b9,rightstick:b10,leftx:a0,lefty:a1,rightx:a3,righty:a4,lefttrigger:a2,righttrigger:a5,dpup:b11,dpleft:b13,dpdown:b12,dpright:b14,
SDL_GAMECONTROLLERCONFIG_FILE=/etc/sdl2/qcom-gamecontrollerdb.txt
SDL_JOYSTICK_DEVICE=
# Prefer evdev/HIDAPI gamepad; disable legacy joystick→mouse helpers in apps that respect these.
SDL_VIDEO_X11_DGAMOUSE=0
