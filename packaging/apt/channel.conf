# SteamOS-Ubuntu apt channel — bump versions before each release tag.
# shellcheck shell=bash

# GitHub monorepo (private OK during development; apt fetch works once repo + Pages are public).
STEAMOS_UBUNTU_GITHUB_REPO="${STEAMOS_UBUNTU_GITHUB_REPO:-MaSieS4Fun/SteamOS-Ubuntu}"

# Apt suite name (Ubuntu Resolute base).
APT_CHANNEL="${APT_CHANNEL:-resolute}"

# Package versions (semver for apps; kernel package tracks KERNEL_VER + deb revision).
PKG_MESA_EASY_MANAGER="${PKG_MESA_EASY_MANAGER:-1.0.0}"
PKG_EASY_UFS_INSTALL="${PKG_EASY_UFS_INSTALL:-1.0.0}"
PKG_PROTON_ARM_EASY_MANAGER="${PKG_PROTON_ARM_EASY_MANAGER:-1.0.0}"
PKG_NO_STEAM_GAMES="${PKG_NO_STEAM_GAMES:-1.0.0}"
PKG_GYRO_DESKTOP="${PKG_GYRO_DESKTOP:-1.0.0}"
PKG_STEAMOS_UBUNTU_APPS="${PKG_STEAMOS_UBUNTU_APPS:-1.0.0}"

# Kernel deb version: <kernel-release>-<deb-rev>, e.g. 7.2.2-edge-sm8550-1
KERNEL_VER="${KERNEL_VER:-7.2.2-edge-sm8550}"
PKG_MASI_KERNEL_DEB_REV="${PKG_MASI_KERNEL_DEB_REV:-1}"
PKG_MASI_KERNEL_EDGE_SM8550="${PKG_MASI_KERNEL_EDGE_SM8550:-${KERNEL_VER}-${PKG_MASI_KERNEL_DEB_REV}}"
